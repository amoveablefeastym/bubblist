<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="shell" id="shell">
    <header id="date"></header>

    <nav class="tabs" id="tabs"></nav>

    <main id="sections"></main>

    <form class="composer" id="composer">
      <div class="row">
        <input id="new" placeholder="Add new todo" maxlength="200" autocomplete="off" spellcheck="false">
        <button type="submit" class="plus" title="Add">+</button>
      </div>
      <div class="options">
        <div class="cats" id="cats"></div>
        <button type="button" class="opt" id="time" title="Time of day"></button>
        <button type="button" class="opt" id="time-clear" title="Remove time" hidden>×</button>
        <button type="button" class="opt" id="repeat"></button>
      </div>
    </form>

    <div class="picker" id="picker" hidden></div>

    <div class="resize side" data-edge="side" title="Drag to resize"></div>
    <div class="resize bottom" data-edge="bottom" title="Drag to resize"></div>
    <div class="resize corner" data-edge="corner" title="Drag to resize"></div>
  </div>

  <canvas class="confetti" id="confetti"></canvas>

  <template id="section-tpl">
    <section>
      <button class="section-head">
        <svg class="tri" viewBox="0 0 10 10"><path d="M2 3.2h6L5 7.2z"/></svg>
        <span class="name"></span>
        <span class="count"></span>
      </button>
      <ul class="tasks"></ul>
    </section>
  </template>

  <script src="panel.js"></script>
</body>
</html>
