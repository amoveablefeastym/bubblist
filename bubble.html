<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --ink: #3f3c3a; --muted: #8e8a86; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }

  /* A soap bubble: clear in the middle, a thin iridescent film that's
     strongest at the rim and slowly swirls, a bright window-shaped highlight,
     and a gentle float. Everything is see-through, so the desktop shows. */
  .orb {
    position: absolute; inset: 8px;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.3,1.6,.5,1);
  }
  .orb:hover { transform: scale(1.08); }
  .orb.open { transform: scale(.94); }

  .bubble {
    position: absolute; inset: 0;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.06), rgba(255,255,255,.02) 55%, rgba(255,255,255,.16) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .55),
      inset 0 0 10px rgba(255, 255, 255, .45),
      inset 5px 7px 12px rgba(120, 210, 255, .18),
      inset -5px -7px 12px rgba(200, 140, 255, .2),
      0 6px 18px rgba(70, 80, 130, .14);
    animation: float 4.5s ease-in-out infinite;
  }
  .orb.jiggle .bubble { animation: jiggle .55s cubic-bezier(.3,1.4,.5,1), float 4.5s ease-in-out .55s infinite; }

  .film {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(255, 140, 200, .95), rgba(255, 215, 120, .95), rgba(140, 240, 190, .95),
      rgba(120, 200, 255, .95), rgba(190, 150, 255, .95), rgba(255, 140, 200, .95));
    -webkit-mask: radial-gradient(circle, transparent 50%, rgba(0,0,0,.25) 63%, #000 80%, rgba(0,0,0,.7) 100%);
    mask: radial-gradient(circle, transparent 50%, rgba(0,0,0,.25) 63%, #000 80%, rgba(0,0,0,.7) 100%);
    opacity: .6;
    filter: blur(1.2px) saturate(1.3);
    animation: swirl 10s linear infinite;
    transition: opacity .3s ease;
  }
  .orb:hover .film { opacity: .8; animation-duration: 4s; }

  /* Highlights: a curved window reflection up top, a small glint below. */
  .shine { position: absolute; inset: 0; }
  .shine::before, .shine::after {
    content: ""; position: absolute; border-radius: 50%;
  }
  .shine::before {
    top: 11%; left: 17%; width: 38%; height: 22%;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0));
    transform: rotate(-38deg);
    filter: blur(.4px);
  }
  .shine::after {
    right: 19%; bottom: 17%; width: 11%; height: 11%;
    background: radial-gradient(circle, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
  }

  .num {
    position: relative;
    font: 400 17px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--ink);
    /* A soft white halo keeps the number readable on any wallpaper. */
    text-shadow: 0 0 2px #fff, 0 0 6px rgba(255,255,255,.95), 0 0 12px rgba(255,255,255,.7);
  }
  .num.done { color: var(--muted); }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50% { transform: translateY(-2px) scale(1.015, .985); }
  }
  @keyframes jiggle {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.1, .9); }
    55% { transform: scale(.95, 1.06); }
    80% { transform: scale(1.02, .98); }
    100% { transform: scale(1, 1); }
  }
  @keyframes swirl { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="orb" id="orb" title="Open Bubblist">
    <div class="bubble">
      <div class="film"></div>
      <div class="shine"></div>
      <span class="num" id="num">✓</span>
    </div>
  </div>
<script>
  const orb = document.getElementById('orb');
  const num = document.getElementById('num');

  orb.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    orb.setPointerCapture(e.pointerId);
    api.dragStart();
  });
  orb.addEventListener('pointerup', (e) => {
    if (e.button !== 0) return;
    api.dragEnd();
  });
  orb.addEventListener('contextmenu', (e) => { e.preventDefault(); api.menu(); });

  api.on('bubble:open', (open) => {
    orb.classList.toggle('open', open);
    // A little wobble, like a bubble being poked.
    orb.classList.remove('jiggle');
    void orb.offsetWidth;
    orb.classList.add('jiggle');
  });
  api.on('bubble:count', (n) => {
    num.textContent = n ? (n > 99 ? '99+' : n) : '✓';
    num.classList.toggle('done', !n);
  });
</script>
</body>
</html>
